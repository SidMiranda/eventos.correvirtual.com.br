name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            # Sem -e, um `git pull` que falha não interrompe nada: o deploy segue,
            # rebuilda o código ANTIGO e imprime "✅ finalizado com sucesso".
            # Aconteceu de verdade em 2026-08-29 (arquivo alterado à mão na VPS).
            set -euo pipefail

            echo "🔄️ Criando .env.."
            cat << 'EOF' > /home/correvirtual/src/.env
              ${{ secrets.APP_ENV }}
            EOF

            # VIEW_COMPILED_PATH=/tmp vem do secret e precisa sair: /tmp é
            # compartilhado e tem sticky bit, então um arquivo compilado que
            # nasceu de outro usuário (qualquer comando rodado como root)
            # trava a aplicação inteira com "rename: Operation not permitted".
            # O padrão do Laravel (storage/framework/views) é volume próprio do
            # container e não tem esse problema.
            sed -i '/^VIEW_COMPILED_PATH=/d' /home/correvirtual/src/.env

            # Configuração que NÃO é segredo mora aqui, versionada, em vez de
            # escondida dentro do secret APP_ENV — onde ninguém consegue revisar
            # nem ver o histórico de mudança.
            echo '' >> /home/correvirtual/src/.env
            echo '# CDN das imagens (bucket R2). Ver docs/specs/armazenamento-r2.md' >> /home/correvirtual/src/.env
            echo 'ARQUIVOS_BASE_URL=https://cdncorrevirtual.mobspot.com.br/publico' >> /home/correvirtual/src/.env
            echo 'R2_BUCKET=correvirtual-arquivos' >> /home/correvirtual/src/.env
            echo 'R2_BUCKET_PRIVADO=correvirtual-privado' >> /home/correvirtual/src/.env

            # Credenciais do R2 em secrets próprios, e não dentro do APP_ENV:
            # assim dá para trocar uma sem reescrever o .env inteiro.
            echo 'R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}' >> /home/correvirtual/src/.env
            echo 'R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}' >> /home/correvirtual/src/.env
            echo 'R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}' >> /home/correvirtual/src/.env

            cd /home/correvirtual

            echo "🚀 Iniciando Deploy..."
            git pull origin main

            # `docker compose` (v2, plugin) e nao `docker-compose` (v1, binario):
            # a VPS so tem o v2. O script chamava o v1 desde sempre e falhava em
            # silencio — sem `set -e`, seguia adiante e imprimia sucesso. O deploy
            # parecia funcionar porque ./src e bind mount e o PHP atualiza sozinho,
            # mas o container nunca era reconstruido. Descoberto em 2026-08-29.
            docker compose up -d --build

            # vendor/ não está no git e o Dockerfile não instala nada: até
            # 2026-08-29 o vendor de produção era um instalado à mão uma única
            # vez. Qualquer dependência nova quebraria o site com "class not
            # found", e só na hora que a rota fosse usada. Descoberto ao
            # adicionar o driver de S3 para o R2.
            docker exec corre_app composer install --no-interaction --optimize-autoloader

            docker exec corre_app php artisan migrate --force

            # Os municipios do IBGE, que alimentam o campo "Cidade" do
            # cadastro. E um upsert pelo codigo do IBGE: rodar em todo deploy
            # nao duplica nada, nao perde o vinculo de ninguem e leva segundos.
            # Fica aqui e nao numa migration de proposito -- na migration,
            # cada classe de teste pagaria 5.571 insercoes.
            docker exec corre_app php artisan cidades:importar --force

            docker exec corre_app php artisan optimize

            # O agendador do Laravel (routes/console.php): hoje, a renovação
            # diária dos tokens do Mercado Pago dos organizadores (ADR 0008) —
            # token vencido é Pix que não sai. Idempotente: tira a linha antiga
            # (se houver) e põe de novo, então rodar em todo deploy não duplica.
            # As chaves com `|| true` são por causa do pipefail: sem crontab
            # ainda, ou sem a linha, os comandos saem com erro sem ser erro.
            LINHA_AGENDADOR='* * * * * docker exec corre_app php artisan schedule:run >> /dev/null 2>&1'
            { { crontab -l 2>/dev/null || true; } | { grep -v 'corre_app php artisan schedule:run' || true; }; echo "$LINHA_AGENDADOR"; } | crontab -
            echo "🕐 Agendador no cron: $(crontab -l | grep -c 'schedule:run') linha(s)"

            echo "✅ Deploy finalizado com sucesso!"